openapi: 3.0.0
info:
  title: Octav Airdrops Status API
  description: Comprehensive blockchain data API for portfolio management, transactions, and DeFi analytics
  version: 1.0.0
  contact:
    name: Octav Support
    url: https://octav.fi
    email: info@octav.fi
servers:
- url: https://api.octav.fi/v1
  description: Production API
security:
- bearerAuth: []
tags:
- name: Status
  description: Status check endpoints
paths:
  /status:
    get:
      summary: Status
      description: 'Check synchronization status and data freshness for addresses.


        **Cost:** Free (0 credits)


        **Get your API key:** [Dev Portal](https://data.octav.fi)'
      operationId: getStatus
      tags:
      - Status
      parameters:
      - name: addresses
        in: query
        required: true
        description: Wallet address (EVM or SOL)
        schema:
          type: string
        example: '0x6426af179aabebe47666f345d69fd9079673f6cd'
      responses:
        '200':
          description: Successful response
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
