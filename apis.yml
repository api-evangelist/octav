aid: octav
name: Octav
description: >-
  Octav is a cryptocurrency portfolio intelligence platform that provides real-time,
  multi-chain portfolio data, transaction history, DeFi protocol positions, and
  historical snapshots across 65+ blockchain networks and 2M+ tokens. Its credit-based,
  read-only REST API lets developers and AI agents build portfolio dashboards, tax
  tools, NAV reporting, alerting, and analytics applications, with decoded DeFi
  positions (lending, LPs, staking, vaults, perps), Solana and EVM address support,
  Ethereum Beacon validator data, and drop-in migration guides from DeBank, Zerion,
  Zapper, Nansen, Covalent, and others. Octav is SOC 2 Type 1 & 2 certified and
  ships official MCP server, Rust CLI, and Agent Skill tooling. Backed by Speedinvest.
