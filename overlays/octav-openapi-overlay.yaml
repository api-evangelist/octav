overlay: 1.0.0
info:
  title: API Evangelist enhancements for Octav API
  version: 1.0.0
extends: openapi/octav-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: octav
    x-apievangelist-artifacts:
      authentication: authentication/octav-authentication.yml
      conventions: conventions/octav-conventions.yml
      errors: errors/octav-problem-types.yml
      lifecycle: lifecycle/octav-lifecycle.yml
      data-model: data-model/octav-data-model.yml
      mcp: mcp/octav-mcp.yml
      cli: cli/octav-cli.yml
      changelog: changelog/octav-changelog.yml
      conformance: conformance/octav-conformance.yml
      agentic-access: agentic-access/octav-agentic-access.yml
- target: $.info
  update:
    x-rate-limit:
      requests_per_minute: 360
      headers: [X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After]
    x-metering:
      model: credit-based
      free_endpoints: [/v1/credits, /v1/status, /v1/chains]
    x-compliance: [SOC 2 Type 1, SOC 2 Type 2]
- target: $.servers
  update:
    x-developer-portal: https://data.octav.fi
    x-documentation: https://docs.octav.fi
